services:
  # Base de données MariaDB
  db:
    image: mariadb:10.6
    container_name: moneywise-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: moneywise_db
    ports:
      - "3307:3306"

  # Backend Spring Boot
  backend:
    build: 
      context: ../backend  # On remonte d'un dossier pour trouver 'backend'
    container_name: moneywise-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/moneywise_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - db

  # Frontend Angular
  frontend:
    build: 
      context: ../frontend # On remonte d'un dossier pour trouver 'frontend'
    container_name: moneywise-ui
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend