server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compression Gzip pour optimiser le temps de chargement
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;

    # Configuration pour servir l'application Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
        
        # Désactiver le cache pour l'index.html (évite les problèmes de déploiement)
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Reverse proxy vers le backend Spring Boot
    # Le '/' à la fin de proxy_pass est crucial pour réécrire l'URL
    location /api/ {
        # 'backend' correspond au nom du service dans docker-compose.yml
        proxy_pass http://backend:8080/;
        
        proxy_http_version 1.1;
        
        # Support pour les WebSockets (utile pour certaines fonctionnalités de monitoring)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers de transmission d'identité (Standard Proxy)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts étendus pour les opérations longues
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Gestion des erreurs Nginx
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Sécurité : Interdire l'accès aux fichiers cachés (comme .htaccess ou .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}